[package]
name = "piread"
version = "0.1.0"
edition = "2024"
description = "Native read pipeline for the pi agent — parity-tested against the built-in read tool"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
